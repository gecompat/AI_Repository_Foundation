name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Foundation project and transfer manifest
        run: python tools/foundation_validator.py --profile full
      - name: Run installation-model tests
        run: python -m unittest discover -s tests -v
