name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PowerShell reference-client runtime
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
      - name: Guard transfer manifest completeness and version consistency
        run: python tools/transfer_manifest_guard.py
      - name: Guard semantic feature coverage and changed-source review
        run: python tools/feature_catalog_guard.py --base "$(git rev-parse HEAD^)"
      - name: Validate Foundation project and transfer manifest
        run: python tools/foundation_validator.py --profile full
      - name: Run installation, transfer-guard, feature-catalog, and cross-language contract tests
        run: python -m unittest discover -s tests -v
